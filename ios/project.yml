name: FM1Sampler
options:
  bundleIdPrefix: com.fm1sampler
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_CXX_LIBRARY: "libc++"
    INFOPLIST_FILE: FM1Sampler/Info.plist
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleExecutable: "$(EXECUTABLE_NAME)"
    INFOPLIST_KEY_CFBundlePackageType: APPL
    PRODUCT_BUNDLE_IDENTIFIER: com.fm1sampler.ios
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_BITCODE: NO
targets:
  FM1Sampler:
    type: application
    platform: iOS
    sources:
      - path: FM1Sampler
        excludes: [Sources, RemoteFM1]
      - path: ../engine/dsp
      - path: ../engine/session
      - path: ../engine/app
      - path: ../engine/ui
      - path: ../engine/3rdparty/kissfft/kiss_fft.c
      - path: ../engine/3rdparty/kissfft/kiss_fftr.c
      - path: ../samples
        type: folder
        buildPhase: resources
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../engine/dsp"
          - "$(SRCROOT)/../engine/session"
          - "$(SRCROOT)/../engine/app"
          - "$(SRCROOT)/../engine/ui"
          - "$(SRCROOT)/../engine/3rdparty/kissfft"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "SAMPLERATE=44100"
        OTHER_CPLUSPLUSFLAGS:
          - "$(inherited)"
          - "-O2"
          - "-w"
        SWIFT_OBJC_BRIDGING_HEADER: "FM1Sampler/FM1Sampler-Bridging-Header.h"
        SWIFT_INCLUDE_PATHS:
          - "$(SRCROOT)/../engine/dsp"
          - "$(SRCROOT)/../engine/session"
          - "$(SRCROOT)/../engine/app"
          - "$(SRCROOT)/../engine/ui"
          - "$(SRCROOT)/../engine/3rdparty/kissfft"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于从手机麦克风采样并录制循环。"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      - sdk: CoreMIDI.framework
      - sdk: UniformTypeIdentifiers.framework
